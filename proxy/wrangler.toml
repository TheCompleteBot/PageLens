# Cloudflare Worker config for the PageLens proxy (see README.md in this folder).
name = "pagelens-proxy"
main = "worker.js"
compatibility_date = "2025-09-01"

[vars]
# Sites whose pages may use the proxy, comma-separated: exact origins, ":*" for any
# port (every local dev server), or "*" for every site (then only the rate limit
# and the key's quota protect it). Add a developer's deployed site as its origin,
# e.g. https://their-shop.com, and run npx wrangler@4 deploy again.
ALLOWED_ORIGINS = "https://thecompletebot.github.io,http://localhost:*,https://localhost:*,http://127.0.0.1:*"

# Per-visitor rate limit: 60 Gemini calls a minute per IP (one question makes about 6-10).
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }
