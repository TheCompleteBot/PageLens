# Cloudflare Worker config for the PageLens proxy (see README.md in this folder).
name = "pagelens-proxy"
main = "worker.js"
compatibility_date = "2025-09-01"

[vars]
# Sites whose pages may use the proxy (exact origins, comma-separated).
ALLOWED_ORIGINS = "https://thecompletebot.github.io,http://localhost:3000,http://localhost:5174"

# Per-visitor rate limit: 60 Gemini calls a minute per IP (one question makes about 6-10).
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }
