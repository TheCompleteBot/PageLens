# Builds PageLens and publishes it to GitHub Pages, without the built file ever
# entering the repo. lib.js calls the PageLens proxy (no key in it) when the
# PAGELENS_PROXY_URL repository variable is set (see proxy/README.md); otherwise the
# key from the PAGELENS_GEMINI_KEY secret is baked in:
#   https://<user>.github.io/PageLens/lib.js         the library
#   https://<user>.github.io/PageLens/demo/          the demo store, using it
#   https://<user>.github.io/PageLens/dashboard/     the example admin dashboard (examples/shadcn-admin)
#
# One-time setup on GitHub:
#   Settings → Secrets and variables → Actions → Variables: PAGELENS_PROXY_URL (recommended),
#     or Secrets: PAGELENS_GEMINI_KEY (the published lib.js then contains the key,
#     and anyone who loads it can read it: use a dedicated key with a daily quota)
#   Settings → Pages → Source: GitHub Actions

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # With the PAGELENS_PROXY_URL repository variable set (see proxy/README.md),
      # lib.js has no key and calls the proxy; otherwise the key is baked in.
      - name: Build lib.js
        env:
          PAGELENS_PROXY_URL: ${{ vars.PAGELENS_PROXY_URL }}
          PAGELENS_GEMINI_KEY: ${{ secrets.PAGELENS_GEMINI_KEY }}
        run: |
          if [ -n "$PAGELENS_PROXY_URL" ]; then
            node build.js --proxy "$PAGELENS_PROXY_URL"
            if grep -qE 'AIza[0-9A-Za-z_-]{20,}' dist/lib.js; then echo "::error::lib.js contains a key"; exit 1; fi
            exit 0
          fi
          if [ -z "$PAGELENS_GEMINI_KEY" ]; then
            echo "::error::Set the PAGELENS_PROXY_URL variable, or add the PAGELENS_GEMINI_KEY secret (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          printf 'PAGELENS_GEMINI_KEY=%s\n' "$PAGELENS_GEMINI_KEY" > .env
          node build.js --key PAGELENS_GEMINI_KEY
          rm .env

      - name: Assemble the site
        run: |
          mkdir -p site/demo
          cp dist/lib.js site/lib.js
          # The demo loads the library from the site root.
          sed 's#src="/dist/lib.js"#src="../lib.js"#' demo/index.html > site/demo/index.html
          grep -q 'src="../lib.js"' site/demo/index.html

      - name: Build the example dashboard
        working-directory: examples/shadcn-admin
        run: |
          npx --yes pnpm@9 install --frozen-lockfile
          npx vite build --base=/PageLens/dashboard/ --outDir ../../site/dashboard
          # Use the one shared lib.js, not the copy Vite took from public/pagelens/.
          rm -rf ../../site/dashboard/pagelens
          sed -i 's#src="/PageLens/dashboard/pagelens/lib.js"#src="/PageLens/lib.js"#' ../../site/dashboard/index.html
          grep -q 'src="/PageLens/lib.js"' ../../site/dashboard/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
